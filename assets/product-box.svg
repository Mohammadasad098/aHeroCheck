<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="boxTitle boxDesc" xml:space="preserve">
  <title id="boxTitle">The Peptides Doc BPC-157 TB-500 GHK-CU Tropical Punch</title>
  <desc id="boxDesc">White product carton with TPD monogram and Tropical Punch flavor bar.</desc>
  <defs>
    <linearGradient id="carton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f1ea"/>
      <stop offset="1" stop-color="#e7e0d2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3a50"/>
      <stop offset="1" stop-color="#0d2436"/>
    </linearGradient>
    <linearGradient id="punch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e26a4a"/>
      <stop offset="1" stop-color="#f0a35b"/>
    </linearGradient>
    <clipPath id="cartonClip">
      <rect x="48" y="48" width="544" height="544" rx="36"/>
    </clipPath>
  </defs>
  <rect x="56" y="64" width="528" height="528" rx="36" fill="#c8bead" opacity="0.55"/>
  <g clip-path="url(#cartonClip)">
    <rect x="48" y="48" width="544" height="544" fill="url(#carton)"/>
    <rect x="48" y="48" width="90" height="544" fill="url(#sheen)"/>
    <text x="320" y="292" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="168" font-weight="700" fill="url(#ink)" letter-spacing="-8">TPD</text>
    <text x="320" y="360" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" letter-spacing="7" fill="#1a3346">THE PEPTIDES DOC</text>
    <text x="320" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.4" fill="#5c7384">GHK-CU  |  BPC-157 &amp; TB-500</text>
    <rect x="48" y="508" width="544" height="84" fill="url(#punch)"/>
    <text x="320" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="8" fill="#fff8f2">TROPICAL PUNCH</text>
  </g>
  <rect x="48" y="48" width="544" height="544" rx="36" fill="none" stroke="#d4ccbe" stroke-width="2"/>
</svg>
